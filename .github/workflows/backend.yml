name: Backend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Test Issuer Backend
        run: ./gradlew :issuer-backend:test --stacktrace

      - name: Test Verifier Backend
        run: ./gradlew :verifier-backend:test --stacktrace

      - name: Build Docker images
        run: |
          docker build -t issuer-backend:latest -f issuer-backend/Dockerfile .
          docker build -t verifier-backend:latest -f verifier-backend/Dockerfile .
