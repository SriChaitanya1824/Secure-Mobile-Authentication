server:
  port: 8080

spring:
  application:
    name: issuer-backend-test
  datasource:
    url: jdbc:h2:mem:certwallet;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

jwt:
  secret: dev-super-secure-jwt-signing-secret-key-32-bytes-minimum
  expirationMs: 86400000
  refreshExpirationMs: 604800000

issuer:
  id: "did:vid:issuer:vit-university"
  name: "VIT Academic Credentials"
  privateKeyBase64: MC4CAQAwBQYDK2VwBCIEIIv7p6m/zI4b6s1x7gq3h0k9jL2u1fQe8w6a5z4y3x2w
