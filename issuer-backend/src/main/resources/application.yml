server:
  port: 8080

spring:
  application:
    name: issuer-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/certwallet}
    username: ${SPRING_DATASOURCE_USERNAME:certwallet_user}
    password: ${SPRING_DATASOURCE_PASSWORD:secure_certwallet_pass_2026}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET:dev-super-secure-jwt-signing-secret-key-32-bytes-minimum}
  expirationMs: 86400000
  refreshExpirationMs: 604800000

issuer:
  id: "did:vid:issuer:vit-university"
  name: "VIT Academic Credentials"
  privateKeyBase64: ${ISSUER_ED25519_PRIVATE_KEY:MC4CAQAwBQYDK2VwBCIEIIv7p6m/zI4b6s1x7gq3h0k9jL2u1fQe8w6a5z4y3x2w}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
