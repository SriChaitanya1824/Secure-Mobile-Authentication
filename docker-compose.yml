services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-secureauth}
      POSTGRES_USER: ${POSTGRES_USER:-secureauth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secureauth}
    ports: ["5432:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U secureauth"], interval: 5s, timeout: 3s, retries: 10 }
    volumes: ["postgres-data:/var/lib/postgresql/data"]
  backend:
    build: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-secureauth}
      POSTGRES_USER: ${POSTGRES_USER:-secureauth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secureauth}
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-this-32-chars}
      OTP_DEVELOPMENT_MODE: ${OTP_DEVELOPMENT_MODE:-true}
    ports: ["8080:8080"]
    depends_on: { postgres: { condition: service_healthy } }
volumes: { postgres-data: {} }
