server:
  port: 8081

spring:
  application:
    name: verifier-backend-test
  datasource:
    url: jdbc:h2:mem:verifierdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

issuer:
  serviceUrl: http://localhost:8080
