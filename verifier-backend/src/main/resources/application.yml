server:
  port: 8081

spring:
  application:
    name: verifier-backend
  datasource:
    url: \${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/certwallet}
    username: \${SPRING_DATASOURCE_USERNAME:certwallet_user}
    password: \${SPRING_DATASOURCE_PASSWORD:secure_certwallet_pass_2026}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  show-sql: false

issuer:
  serviceUrl: \${ISSUER_SERVICE_URL:http://localhost:8080}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
